name: Deploy ChronoLine to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify site assets and JavaScript
        run: |
          test -f index.html
          test -f ai-expansion.js
          node --check ai-expansion.js
          node --check ai-batched-builder.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          assert 'ai-expansion.js' in html
          inline=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/chronoline-inline.js').write_text(inline)
          PY
          node --check /tmp/chronoline-inline.js
      - name: Bundle KittenTTS Nano browser engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          # The SDK used previously was not available at esm.sh and caused HTTP 404.
          # Fetch a published, pinned, standalone ESM build during deployment instead.
          npm pack kitten-tts-webgpu@0.1.1 --silent --pack-destination "$RUNNER_TEMP"
          tar -xOf "$RUNNER_TEMP/kitten-tts-webgpu-0.1.1.tgz" package/dist-lib/index.js > assets/kitten-tts-webgpu.js
          tar -xOf "$RUNNER_TEMP/kitten-tts-webgpu-0.1.1.tgz" package/LICENSE > assets/kitten-tts-LICENSE.txt
          test "$(wc -c < assets/kitten-tts-webgpu.js)" -gt 100000
          node --check assets/kitten-tts-webgpu.js
          echo "Vendored browser engine: $(wc -c < assets/kitten-tts-webgpu.js) bytes"
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
