name: Deploy ChronoLine to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify site assets and JavaScript
        run: |
          test -f index.html
          test -f ai-expansion.js
          node --check ai-expansion.js
          node --check ai-batched-builder.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          assert 'ai-expansion.js' in html
          inline=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/chronoline-inline.js').write_text(inline)
          PY
          node --check /tmp/chronoline-inline.js
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
